plugins {
    id 'com.android.application'
}

android {
    namespace 'com.andrecell.vpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.andrecell.vpn"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Agar tidak error saat memasukkan file .so
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Memberitahu Android Studio / GitHub untuk mencari library native (.so)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // Library dasar Android
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ==========================================
    // TAMBAHAN PENTING UNTUK MEMBACA FILE .AAR
    // ==========================================
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
